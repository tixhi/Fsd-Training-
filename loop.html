<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loops</title>
</head>
<body>
    <p id="demo"></p>

    <script>
        // for loop
    //     for( let i=1; i<=10 ;i++)
    // {
    //     document.write("<br> abes college");
    // }
    const arr=["car1","car2","car3","car4"];
    let text =" ";
    
    for(let i=0;i<arr.length;i++)
    {
        if( i%2==0){
        // document.write("<br>"+arr[i]);
        text += arr[i] + "<br>";
        }

    }
    document.getElementById("demo").innerHTML = text;
    </script>
</body>
</html>
