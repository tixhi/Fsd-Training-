<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASSIGNMENT2</title>
</head>
<body>

<script>

const student1 = {name:"Rishi", clss:"btech", fees:200000};
const student2 = {name:"Vansh", clss:"mba", fees:150000};
const student3 = {name:"satyapal", clss:"mtech", fees:300000};
const student4 = {name:"tanmay", clss:"mba", fees:150000};
const student5 = {name:"Rishav", clss:"mca", fees:100000};

let n = prompt("Enter preferred branch");

const student = [student1, student2, student3, student4, student5];

const result = student.filter(function(s) {
    return s.clss == n;
});

result.forEach(function(s) {
    document.write(s.name + "<br>");
});

</script>

</body>
</html>
