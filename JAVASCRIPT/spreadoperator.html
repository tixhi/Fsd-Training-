<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spread</title>
</head>
<body>
    <script>
        const arr1=[1,2,3,4,5];
        const arr2=[6,7,8,9];
        const arr3=[...arr1,...arr2];
        document.write(arr3);
    </script>
    
</body>
